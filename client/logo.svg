<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f2942;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c05621;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ed8936;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#c05621" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle decorative ring -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="230" r="110" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Open book shape -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <!-- Left page -->
    <path d="M-60,-70 Q-30,-80 0,-70 L0,50 Q-30,60 -60,50 Q-30,40 0,30 L0,-30 Q-30,-40 -60,-30Z"
          fill="rgba(255,255,255,0.9)" opacity="0.9"/>
    <!-- Right page -->
    <path d="M0,-70 Q30,-80 60,-70 L60,50 Q30,60 0,50 L0,30 Q30,40 60,30 L60,-30 Q30,-40 0,-30Z"
          fill="rgba(255,255,255,0.85)" opacity="0.85"/>
    <!-- Spine -->
    <line x1="0" y1="-70" x2="0" y2="50" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>

  <!-- Cross overlay -->
  <g transform="translate(256, 200)" filter="url(#glow)">
    <rect x="-6" y="-45" width="12" height="90" rx="4" fill="url(#crossGrad)"/>
    <rect x="-25" y="-20" width="50" height="12" rx="4" fill="url(#crossGrad)"/>
  </g>

  <!-- Text: BereaFS -->
  <text x="256" y="370" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">BereaFS</text>

  <!-- Subtitle line -->
  <line x1="156" y1="385" x2="356" y2="385" stroke="url(#crossGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Subtitle: Formation Biblique -->
  <text x="256" y="415" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="18" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="4">
    FORMATION BIBLIQUE
  </text>

  <!-- Small decorative dots -->
  <circle cx="140" cy="390" r="3" fill="url(#crossGrad)" opacity="0.5"/>
  <circle cx="372" cy="390" r="3" fill="url(#crossGrad)" opacity="0.5"/>
</svg>
