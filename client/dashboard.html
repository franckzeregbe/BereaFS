<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BereaFS - Plateforme</title>
    <link rel="stylesheet" href="/client/assets/css/styles.css">
    <style>
        /* ===== SIDEBAR ===== */
        .app{display:flex;min-height:100vh}
        .sidebar{width:280px;height:100vh;background:linear-gradient(165deg,#1a365d 0%,#0f2942 100%);color:#fff;position:fixed;left:0;top:0;z-index:1000;display:flex;flex-direction:column;overflow-y:auto}
        .sidebar-header{padding:24px;border-bottom:1px solid rgba(255,255,255,.08)}
        .brand{display:flex;align-items:center;gap:14px}
        .brand-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .brand-icon svg{width:38px;height:38px}
        .brand-text h1{font-size:1.15rem;font-weight:700}.brand-text p{font-size:.75rem;opacity:.55}
        .user-card{margin:16px;padding:16px;background:rgba(255,255,255,.06);border-radius:12px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;border:1px solid rgba(255,255,255,.04)}
        .user-card:hover{background:rgba(255,255,255,.1)}
        .user-avatar{width:48px;height:48px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem;text-transform:uppercase;overflow:hidden}
        .user-avatar img{width:100%;height:100%;object-fit:cover}
        .user-name{font-size:.9rem;font-weight:600}.user-role{font-size:.75rem;opacity:.5}
        .nav-section{padding:16px 24px 8px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;opacity:.4;font-weight:600}
        .nav-item{display:flex;align-items:center;gap:14px;padding:12px 20px;margin:2px 12px;color:rgba(255,255,255,.75);text-decoration:none;font-size:.9rem;border-radius:10px;cursor:pointer;transition:all .2s;font-weight:500}
        .nav-item:hover,.nav-item.active{background:rgba(255,255,255,.1);color:#fff}
        .nav-item.active{font-weight:600;border-left:3px solid var(--accent)}
        .offline-badge{display:none;padding:8px 16px;margin:0 16px 16px;background:rgba(5,150,105,.2);border:1px solid rgba(5,150,105,.3);color:#a7f3d0;border-radius:10px;font-size:.8rem;text-align:center}
        .offline-badge.show{display:block}
        .logout-btn{margin:auto 16px 16px;padding:12px;background:rgba(220,38,28,.2);border:1px solid rgba(220,38,28,.3);color:#fecaca;border-radius:10px;cursor:pointer;font-size:.875rem;text-align:center;transition:all .2s}
        .logout-btn:hover{background:rgba(220,38,28,.3)}

        /* ===== MAIN ===== */
        .main{flex:1;margin-left:280px;padding:24px 32px;min-height:100vh;transition:all .3s}
        .mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:rgba(255,255,255,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:999;align-items:center;justify-content:space-between;padding:0 16px}
        .mobile-toggle{display:none;width:40px;height:40px;border:none;background:transparent;font-size:1.4rem;cursor:pointer;border-radius:10px}

        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
        .top-bar h2{font-size:1.5rem;font-weight:700}

        /* ===== STATS ===== */
        .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
        .stat-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden;transition:all .3s}
        .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:3px 3px 0 0}
        .stat-card:nth-child(1)::before{background:var(--primary-light)}.stat-card:nth-child(2)::before{background:var(--success)}.stat-card:nth-child(3)::before{background:var(--accent)}.stat-card:nth-child(4)::before{background:var(--danger)}
        .stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
        .stat-label{font-size:.8rem;color:var(--text-light);font-weight:500}.stat-value{font-size:2rem;font-weight:700;margin-top:8px}.stat-trend{font-size:.8rem;margin-top:8px;font-weight:500}
        .trend-up{color:var(--success)}.trend-down{color:var(--danger)}

        .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
        .section-title{font-size:1.1rem;font-weight:700}

        /* ===== MODULES ===== */
        .modules-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        .module-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .3s;display:flex;flex-direction:column}
        .module-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
        .module-header{padding:24px;flex:1}
        .module-tag{display:inline-flex;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;text-transform:uppercase}
        .tag-fondements{background:#f0fdf4;color:var(--success)}.tag-theologie{background:#eef2ff;color:#4f46e5}.tag-pratique{background:#fff7ed;color:var(--accent)}.tag-avance{background:#fef2f2;color:var(--danger)}
        .module-title{font-size:1.05rem;font-weight:700;margin:12px 0 8px}.module-desc{font-size:.85rem;color:var(--text-light);line-height:1.6}
        .module-progress{padding:0 24px 20px}
        .progress-bar-bg{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden}
        .progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#ed8936);border-radius:4px;transition:width 1s ease}
        .progress-text{display:flex;justify-content:space-between;margin-top:10px;font-size:.82rem}.progress-text .pct{font-weight:700;color:var(--accent)}
        .module-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .module-meta{display:flex;gap:16px;font-size:.8rem;color:var(--text-light)}
        .module-link{color:var(--primary-light);font-size:.85rem;font-weight:600;text-decoration:none;cursor:pointer}.module-link:hover{color:var(--primary)}

        /* ===== TABLES ===== */
        .data-table{width:100%;border-collapse:collapse}
        .data-table th{text-align:left;padding:12px;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-light);font-weight:600;border-bottom:1px solid var(--border)}
        .data-table td{padding:14px 12px;border-bottom:1px solid #f7fafc;font-size:.9rem}
        .data-table tr:hover td{background:#f7fafc}
        .student-name{display:flex;align-items:center;gap:12px}
        .mini-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}

        .status-badge{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
        .status-actif{background:#f0fdf4;color:var(--success)}.status-retard{background:#fef2f2;color:var(--danger)}.status-complet{background:#dbeafe;color:var(--primary-light)}
        .score-ring{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700}
        .score-high{background:#d1fae5;color:#065f46}.score-mid{background:#fef3c7;color:#92400e}.score-low{background:#fee2e2;color:#991b1b}

        .teacher-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px}
        .activity-list{display:flex;flex-direction:column;gap:16px}
        .activity-item{display:flex;gap:12px;padding-bottom:16px;border-bottom:1px solid #f0f0f0}
        .activity-item:last-child{border:none;padding-bottom:0}
        .activity-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
        .dot-complet{background:var(--success);box-shadow:0 0 6px var(--success)}
        .dot-exercice{background:var(--primary-light);box-shadow:0 0 6px var(--primary-light)}
        .dot-recherche{background:var(--accent);box-shadow:0 0 6px var(--accent)}

        /* ===== FORMS ===== */
        .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
        .form-full{grid-column:1/-1}
        .input-group{margin-bottom:20px}
        .input-group label{display:block;font-size:.875rem;font-weight:500;margin-bottom:8px;color:var(--text)}
        .input-group input,.input-group textarea,.input-group select{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:12px;font-size:.95rem;font-family:inherit;outline:none;transition:all .2s}
        .input-group input:focus,.input-group textarea:focus,.input-group select:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(44,82,130,.08)}
        .input-group textarea{min-height:120px;resize:vertical}

        /* ===== LESSONS ===== */
        .lesson-item{padding:16px;border-radius:12px;border:1px solid var(--border);margin-bottom:8px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:all .2s}
        .lesson-item:hover{border-color:var(--primary-light);background:#f8fafb}
        .lesson-item.active{border-color:var(--accent);background:#fff7ed}
        .lesson-number{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem;flex-shrink:0}
        .lesson-number.done{background:var(--success);color:#fff}.lesson-number.current{background:var(--accent);color:#fff}.lesson-number.pending{background:#f1f5f9;color:var(--text-light)}

        /* ===== VIDEO/AUDIO ===== */
        .video-container{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:20px}
        .video-container video{width:100%;display:block}
        .audio-player{background:var(--card);border-radius:12px;padding:16px;border:1px solid var(--border);display:flex;align-items:center;gap:16px;margin-bottom:20px}
        .audio-player button{width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .audio-info{flex:1}.audio-info h4{font-size:.95rem;font-weight:600}.audio-info p{font-size:.8rem;color:var(--text-light)}

        /* ===== QUIZ ===== */
        .quiz-container{background:var(--card);border-radius:16px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);max-width:700px;margin:0 auto}
        .quiz-progress{height:8px;background:#f1f5f9;border-radius:4px;overflow:hidden;margin-bottom:24px}
        .quiz-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#ed8936);border-radius:4px;transition:width .3s}
        .quiz-question{font-size:1.15rem;font-weight:600;margin-bottom:20px;line-height:1.5}
        .quiz-options{display:flex;flex-direction:column;gap:12px}
        .quiz-option{padding:16px;border:2px solid var(--border);border-radius:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
        .quiz-option:hover{border-color:var(--primary-light);background:#f8fafb}
        .quiz-option.selected{border-color:var(--accent);background:#fff7ed}
        .quiz-option.correct{border-color:var(--success);background:#f0fdf4}
        .quiz-option.wrong{border-color:var(--danger);background:#fef2f2}
        .quiz-letter{width:32px;height:32px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.875rem;flex-shrink:0}
        .quiz-option.selected .quiz-letter{background:var(--accent);color:#fff}
        .explanation{background:#f0f9ff;border-left:4px solid var(--primary-light);padding:16px 20px;border-radius:0 12px 12px 0;margin-top:16px;display:none}
        .explanation.show{display:block}

        /* ===== UPLOAD ZONE ===== */
        .upload-zone{border:3px dashed var(--border);border-radius:16px;padding:40px;text-align:center;cursor:pointer;transition:all .3s;background:#fff}
        .upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:#fff7ed}
        .upload-progress{display:none;margin-top:16px;background:#f1f5f9;border-radius:10px;overflow:hidden;height:24px}
        .upload-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#ed8936);width:0%;transition:width .3s;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600}

        /* ===== MODAL ===== */
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:2000;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
        .modal-overlay.active{display:flex}
        .modal{background:#fff;border-radius:24px;width:100%;max-width:550px;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px -12px rgba(0,0,0,.25)}
        .modal-header{padding:24px 24px 0;display:flex;justify-content:space-between;align-items:center}
        .modal-header h2{font-size:1.25rem;font-weight:700}
        .modal-close{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:transparent;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
        .modal-body{padding:0 24px 24px}
        .avatar-upload{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:2rem;color:#fff;cursor:pointer;position:relative;overflow:hidden;font-weight:700;text-transform:uppercase}
        .avatar-upload img{width:100%;height:100%;object-fit:cover}
        .avatar-upload input{display:none}

        /* ===== LOADING ===== */
        .loading{text-align:center;padding:60px;color:var(--text-light)}
        .loading .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
        @keyframes spin{to{transform:rotate(360deg)}}

        @media(max-width:1024px){.modules-grid{grid-template-columns:repeat(2,1fr)}.teacher-grid{grid-template-columns:1fr}}
        @media(max-width:768px){
            .sidebar{transform:translateX(-100%);transition:transform .3s}.sidebar.open{transform:translateX(0)}
            .main{margin-left:0;padding:72px 16px 16px}
            .mobile-header{display:flex}.mobile-toggle{display:flex;align-items:center;justify-content:center}
            .stats-grid{grid-template-columns:repeat(2,1fr)}.modules-grid{grid-template-columns:1fr}
            .form-grid{grid-template-columns:1fr}
        }
        @media(max-width:480px){.stats-grid{grid-template-columns:1fr}.top-bar{flex-direction:column;align-items:flex-start}}
    </style>
</head>
<body>
    <div class="app">
        <!-- MOBILE HEADER -->
        <div class="mobile-header">
            <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo-icon">
                <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="40" cy="36" r="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                    <path d="M28,18 Q34,16 40,18 L40,42 Q34,44 28,42 Q34,40 40,38 L40,28 Q34,26 28,28Z" fill="rgba(255,255,255,0.9)"/>
                    <path d="M40,18 Q46,16 52,18 L52,42 Q46,44 40,42 L40,38 Q46,40 52,38 L52,28 Q46,26 40,28Z" fill="rgba(255,255,255,0.8)"/>
                    <line x1="40" y1="18" x2="40" y2="42" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                    <rect x="38" y="14" width="4" height="20" rx="1.5" fill="#ed8936"/>
                    <rect x="33" y="20" width="14" height="4" rx="1.5" fill="#c05621"/>
                </svg>
            </div>
            <button class="btn btn-sm btn-outline" onclick="Auth.logout()">🚪</button>
        </div>

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="40" cy="36" r="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
                            <path d="M28,18 Q34,16 40,18 L40,42 Q34,44 28,42 Q34,40 40,38 L40,28 Q34,26 28,28Z" fill="rgba(255,255,255,0.9)"/>
                            <path d="M40,18 Q46,16 52,18 L52,42 Q46,44 40,42 L40,38 Q46,40 52,38 L52,28 Q46,26 40,28Z" fill="rgba(255,255,255,0.8)"/>
                            <line x1="40" y1="18" x2="40" y2="42" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
                            <rect x="38" y="14" width="4" height="20" rx="1.5" fill="#ed8936"/>
                            <rect x="33" y="20" width="14" height="4" rx="1.5" fill="#c05621"/>
                        </svg>
                    </div>
                    <div class="brand-text"><h1>BereaFS</h1><p>Formation Biblique</p></div>
                </div>
            </div>
            <div class="user-card" onclick="openProfile()">
                <div class="user-avatar" id="sidebarAvatar">PJ</div>
                <div><div class="user-name" id="sidebarName">Chargement...</div><div class="user-role" id="sidebarRole">...</div></div>
            </div>
            <div class="offline-badge" id="offlineBadge">📶 Mode hors-ligne</div>
            <nav id="navItems"></nav>
            <button class="logout-btn" onclick="Auth.logout()">🚪 Se déconnecter</button>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main" id="main">
            <div class="loading"><div class="spinner"></div>Chargement...</div>
        </main>
    </div>

    <!-- MODAL PROFIL -->
    <div class="modal-overlay" id="profileModal" onclick="if(event.target===this)closeProfile()">
        <div class="modal">
            <div class="modal-header"><h2>Mon Profil</h2><button class="modal-close" onclick="closeProfile()">×</button></div>
            <div class="modal-body">
                <div class="avatar-upload" id="avatarDisplay" onclick="document.getElementById('avatarInput').click()">PJ<input type="file" id="avatarInput" accept="image/*" onchange="handleAvatar(event)"></div>
                <form onsubmit="saveProfile(event)">
                    <div class="form-grid">
                        <div class="input-group"><label>Nom</label><input type="text" id="pName" required></div>
                        <div class="input-group"><label>Email</label><input type="email" id="pEmail" disabled></div>
                        <div class="input-group"><label>Téléphone</label><input type="tel" id="pPhone"></div>
                        <div class="input-group"><label>Pays</label><select id="pCountry"><option value="CI">Côte d'Ivoire</option><option value="BF">Burkina Faso</option><option value="ML">Mali</option><option value="SN">Sénégal</option><option value="GH">Ghana</option><option value="TG">Togo</option><option value="BJ">Bénin</option></select></div>
                        <div class="input-group"><label>Mot de passe actuel</label><input type="password" id="pCurrentPass" placeholder="Pour confirmer"></div>
                        <div class="input-group"><label>Nouveau mot de passe</label><input type="password" id="pNewPass" placeholder="8+ caractères, majuscule, minuscule, chiffre"></div>
                        <div class="input-group form-full"><button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">💾 Sauvegarder</button></div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/client/assets/js/api.js"></script>
    <script src="/client/assets/js/auth.js"></script>
    <script src="/client/assets/js/security.js"></script>
    <script src="/client/assets/js/notifications.js"></script>
    <script src="/client/assets/js/pwa.js"></script>
    <script src="/client/assets/js/app.js"></script>
</body>
</html>
