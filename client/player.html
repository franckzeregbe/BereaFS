<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BereaFS - Lecteur Vidéo</title>
    <link rel="stylesheet" href="/client/assets/css/styles.css">
    <style>
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column;margin:0}
        .top-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:rgba(30,58,95,.95);position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(10px)}
        .top-bar h1{font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px}
        .top-bar a{color:#ed8936;text-decoration:none;font-size:.85rem;font-weight:600}
        .video-container{flex:1;display:flex;align-items:center;justify-content:center;padding-top:60px}
        video{width:100%;max-width:1200px;max-height:calc(100vh - 80px);display:block;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
        .info-bar{background:rgba(30,58,95,.95);padding:16px 24px;position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(10px);z-index:100}
        .info-bar h3{margin:0;font-size:1rem}.info-bar span{color:#94a3b8;font-size:.85rem}
        .loading{display:flex;align-items:center;justify-content:center;flex:1;font-size:1.2rem;color:#94a3b8;flex-direction:column;gap:16px}
        .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:#c05621;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .error-state{text-align:center;padding:60px 20px;color:#94a3b8}
        .error-state h2{margin-bottom:12px}
        .back-btn{position:fixed;top:70px;left:24px;z-index:101;background:rgba(30,58,95,.9);color:#fff;border:none;padding:10px 20px;border-radius:10px;cursor:pointer;font-size:.9rem;text-decoration:none}
        .back-btn:hover{background:rgba(30,58,95,1)}
        @media(max-width:768px){.top-bar h1{font-size:.9rem}.info-bar{flex-direction:column;gap:8px;text-align:center}}
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>✦ BereaFS</h1>
        <a href="/client">← Retour à la plateforme</a>
    </div>
    <a class="back-btn" href="/client">← Retour</a>
    <div class="video-container" id="container">
        <div class="loading"><div class="spinner"></div>Chargement de la vidéo...</div>
    </div>
    <div class="info-bar" id="infoBar" style="display:none">
        <h3 id="videoTitle">Chargement...</h3>
        <span id="videoInfo"></span>
    </div>
    <script>
    const p=new URLSearchParams(window.location.search);
    const videoId=p.get('video');
    const title=p.get('title')||'Vidéo';
    if(!videoId){document.getElementById('container').innerHTML='<div class="error-state"><h2>Vidéo introuvable</h2><p>Aucun identifiant de vidéo fourni.</p><a href="/client" class="btn btn-primary" style="display:inline-block;margin-top:16px;color:#fff;text-decoration:none">Retour</a></div>';}
    document.getElementById('videoTitle').textContent=decodeURIComponent(title);
    const src='/api/stream/'+encodeURIComponent(videoId);
    const container=document.getElementById('container');
    container.innerHTML=`<video id="player" controls playsinline preload="metadata"><source src="${src}" type="video/mp4">Votre navigateur ne supporte pas la lecture vidéo.</video>`;
    const video=document.getElementById('player');
    fetch('/api/info/'+encodeURIComponent(videoId)).then(r=>r.json()).then(data=>{
        document.getElementById('infoBar').style.display='flex';
        document.getElementById('videoInfo').textContent=(data.sizeHuman||'')+' • '+new Date(data.created).toLocaleDateString('fr-FR');
    }).catch(()=>{});
    video.addEventListener('error',()=>{container.innerHTML='<div class="error-state"><h2>Erreur de lecture</h2><p>Impossible de charger la vidéo. Le fichier existe-t-il ?</p><a href="/client" style="color:#ed8936;text-decoration:none">Retour</a></div>';});
    </script>
</body>
</html>
